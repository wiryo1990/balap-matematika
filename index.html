<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Balap Mobil Matematika - Ibu Lia</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & React DOM Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Compiler for JSX in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-slate-900 overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SVG CAR (Always Facing Right) ---
        const CarSVG = ({ color }) => (
          <svg viewBox="0 0 100 40" fill={color} className="w-16 h-8 md:w-28 md:h-14 drop-shadow-xl z-20">
            {/* Body */}
            <path d="M10,30 L10,20 L25,10 L60,10 L75,20 L95,20 L95,30 Z" fill={color} />
            {/* Wheels */}
            <circle cx="25" cy="30" r="8" fill="#1e293b" />
            <circle cx="25" cy="30" r="4" fill="#cbd5e1" />
            <circle cx="75" cy="30" r="8" fill="#1e293b" />
            <circle cx="75" cy="30" r="4" fill="#cbd5e1" />
            {/* Windows */}
            <path d="M30,10 L45,10 L45,20 L25,20 Z" fill="#bae6fd" />
            <path d="M50,10 L60,10 L70,20 L50,20 Z" fill="#bae6fd" />
            {/* Headlight */}
            <path d="M92,22 L95,22 L95,26 L92,26 Z" fill="#fde047" />
          </svg>
        );

        // --- AUDIO UTILITY ---
        const playAudio = (type) => {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
          } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
          } else if (type === 'win') {
            osc.type = 'triangle';
            [440, 554, 659, 880].forEach((freq, i) => {
              osc.frequency.setValueAtTime(freq, ctx.currentTime + (i * 0.15));
            });
            gain.gain.setValueAtTime(0.4, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1);
            osc.start();
            osc.stop(ctx.currentTime + 1);
          }
        };

        // --- MATH LOGIC ---
        const generateMath = () => {
          const isAdd = Math.random() > 0.5;
          let a, b, answer;
          
          if (isAdd) {
            answer = Math.floor(Math.random() * 9) + 2; // 2 - 10
            a = Math.floor(Math.random() * (answer - 1)) + 1; 
            b = answer - a;
          } else {
            a = Math.floor(Math.random() * 9) + 2; // 2 - 10
            b = Math.floor(Math.random() * (a - 1)) + 1;
            answer = a - b;
          }
          
          const question = isAdd ? `${a} + ${b} = ?` : `${a} - ${b} = ?`;
          
          let options = [answer];
          while (options.length < 4) {
            let wrong = answer + (Math.floor(Math.random() * 7) - 3); 
            if (wrong >= 0 && wrong <= 15 && !options.includes(wrong)) {
              options.push(wrong);
            }
          }
          options.sort(() => Math.random() - 0.5);
          
          return { question, options, answer };
        };

        // --- LAYOUT WRAPPER (Anti-Scroll) ---
        const ScreenWrapper = ({ children, bgClass = "bg-gradient-to-b from-sky-100 to-indigo-200" }) => (
          <div className={`h-screen w-screen overflow-hidden flex flex-col font-sans select-none touch-none ${bgClass}`}>
            {children}
          </div>
        );

        // --- MAIN APP COMPONENT ---
        function App() {
          const [step, setStep] = useState(1);
          const [players, setPlayers] = useState([]);
          const [winner, setWinner] = useState(null);
          const [numPlayers, setNumPlayers] = useState(2);
          const [customNames, setCustomNames] = useState(['Siswa 1', 'Siswa 2', 'Siswa 3', 'Siswa 4']);

          const THEMES = [
            { id: 1, color: '#ef4444', bg: 'bg-red-200', text: 'text-red-900', btn: 'bg-red-500 shadow-[0_6px_0_#991b1b]', name: 'Siswa 1' },
            { id: 2, color: '#3b82f6', bg: 'bg-blue-200', text: 'text-blue-900', btn: 'bg-blue-500 shadow-[0_6px_0_#1e3a8a]', name: 'Siswa 2' },
            { id: 3, color: '#10b981', bg: 'bg-green-200', text: 'text-green-900', btn: 'bg-green-500 shadow-[0_6px_0_#14532d]', name: 'Siswa 3' },
            { id: 4, color: '#f59e0b', bg: 'bg-yellow-200', text: 'text-yellow-900', btn: 'bg-yellow-500 shadow-[0_6px_0_#a16207]', name: 'Siswa 4' }
          ];

          const finishLineScore = 8;

          const startGame = () => {
            playAudio('correct');
            const newPlayers = THEMES.slice(0, numPlayers).map((theme, index) => ({
              ...theme,
              name: customNames[index].trim() || theme.name,
              score: 0,
              ...generateMath()
            }));
            setPlayers(newPlayers);
            setStep(3); 
          };

          const handleAnswer = (playerId, selectedAnswer) => {
            setPlayers(prevPlayers => {
              const newPlayers = [...prevPlayers];
              const playerIndex = newPlayers.findIndex(p => p.id === playerId);
              const player = newPlayers[playerIndex];

              if (selectedAnswer === player.answer) {
                playAudio('correct');
                player.score += 1;
                
                if (player.score >= finishLineScore) {
                  playAudio('win');
                  setWinner(player);
                  setStep(4);
                  return newPlayers;
                }
              } else {
                playAudio('wrong');
              }

              const nextMath = generateMath();
              player.question = nextMath.question;
              player.options = nextMath.options;
              player.answer = nextMath.answer;

              return newPlayers;
            });
          };

          // STEP 1: WELCOME
          if (step === 1) return (
            <ScreenWrapper>
              <div className="flex-1 flex flex-col items-center justify-around p-3 md:p-6 text-center">
                <div className="flex flex-col items-center mt-1">
                  <h1 className="text-3xl md:text-5xl font-black text-white drop-shadow-[0_6px_6px_rgba(0,0,0,0.5)] tracking-tight leading-tight">
                    BALAP MOBIL MATEMATIKA
                  </h1>
                  <h2 className="text-xl md:text-3xl font-extrabold text-pink-600 mt-1 drop-shadow-md">
                    ~ bersama Pak Wiryo ~
                  </h2>
                </div>

                <div className="flex items-center justify-center w-full max-w-4xl my-2 px-2">
                  <div className="w-full bg-white/95 rounded-[2rem] p-6 md:p-8 shadow-2xl border-4 border-yellow-400 flex flex-col justify-center min-h-[300px] md:h-[360px]">
                    <h3 className="text-xl md:text-3xl font-black text-indigo-900 mb-6 bg-yellow-300 inline-block px-8 py-2 rounded-full self-center shadow-sm">
                      Aturan Bermain
                    </h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 text-lg md:text-2xl font-bold text-gray-800">
                      <div className="flex gap-4 items-center bg-blue-50 p-4 md:p-5 rounded-2xl border-2 border-blue-200 shadow-sm">
                        <span className="text-3xl md:text-5xl">⚡</span> Cepat-cepatan jawab!
                      </div>
                      <div className="flex gap-4 items-center bg-green-50 p-4 md:p-5 rounded-2xl border-2 border-green-200 shadow-sm">
                        <span className="text-3xl md:text-5xl">✅</span> BENAR = Mobil maju
                      </div>
                      <div className="flex gap-4 items-center bg-red-50 p-4 md:p-5 rounded-2xl border-2 border-red-200 shadow-sm">
                        <span className="text-3xl md:text-5xl">🛑</span> SALAH = Mobil diam
                      </div>
                      <div className="flex gap-4 items-center bg-yellow-50 p-4 md:p-5 rounded-2xl border-2 border-yellow-200 shadow-sm">
                        <span className="text-3xl md:text-5xl">🏆</span> Sampai duluan menang
                      </div>
                    </div>
                  </div>
                </div>

                <button 
                  onClick={() => { playAudio('correct'); setStep(2); setNumPlayers(2); }} 
                  className="bg-green-500 hover:bg-green-600 text-white font-black text-4xl md:text-5xl px-16 py-6 rounded-[3rem] shadow-[0_12px_0_#14532d] active:translate-y-3 active:shadow-none transition-all border-8 border-white shrink-0 mt-4"
                >
                  Lanjutkan 🚀
                </button>
              </div>
            </ScreenWrapper>
          );

          // STEP 2: MODE & NAME
          if (step === 2) return (
            <ScreenWrapper>
              <div className="flex-1 flex flex-col items-center justify-center p-4">
                <div className="bg-white/95 rounded-[2rem] p-8 shadow-2xl border-4 border-indigo-400 w-full max-w-2xl text-center">
                  <h2 className="text-3xl md:text-4xl font-black text-indigo-900 mb-6">Pilih Mode & Nama</h2>
                  
                  <div className="flex justify-center gap-4 mb-8">
                    {[2, 3, 4].map(num => (
                      <button 
                        key={num}
                        onClick={() => { playAudio('correct'); setNumPlayers(num); }}
                        className={`${numPlayers === num ? 'bg-indigo-600 text-white scale-110 shadow-lg' : 'bg-indigo-100 text-indigo-800'} font-bold text-xl md:text-2xl px-6 py-3 rounded-xl transition-all`}
                      >
                        {num} Pemain
                      </button>
                    ))}
                  </div>

                  <div className="flex flex-col gap-4 mb-8 text-left">
                    {Array.from({ length: numPlayers }).map((_, idx) => (
                      <div key={idx} className="flex items-center gap-4">
                        <div className="w-8 h-8 rounded-full shadow-md border-2 border-white" style={{ backgroundColor: THEMES[idx].color }}></div>
                        <input 
                          type="text" 
                          maxLength={10}
                          value={customNames[idx]}
                          onChange={(e) => {
                            const newNames = [...customNames];
                            newNames[idx] = e.target.value;
                            setCustomNames(newNames);
                          }}
                          className="flex-1 bg-slate-100 border-2 border-slate-300 rounded-xl px-4 py-3 text-xl font-bold focus:border-indigo-500 focus:outline-none"
                          placeholder={`Nama Pemain ${idx + 1}`}
                        />
                      </div>
                    ))}
                  </div>

                  <button 
                    onClick={startGame} 
                    className="w-full bg-green-500 hover:bg-green-600 text-white font-black text-3xl py-4 rounded-2xl shadow-[0_8px_0_#14532d] active:translate-y-2 active:shadow-none transition-all"
                  >
                    Mulai Balapan! 🏁
                  </button>
                </div>
              </div>
            </ScreenWrapper>
          );

          // STEP 3: RACING
          if (step === 3) return (
            <ScreenWrapper bgClass="bg-slate-800">
              <div className="h-[10vh] flex items-center justify-between px-6 bg-slate-900 border-b-4 border-slate-700">
                <h2 className="text-2xl md:text-3xl font-black text-white drop-shadow-md">🏁 Balapan Dimulai!</h2>
                <button 
                  onClick={() => setStep(1)} 
                  className="bg-red-500 hover:bg-red-600 text-white font-bold text-lg px-6 py-2 rounded-xl shadow-[0_4px_0_#991b1b] active:translate-y-1 active:shadow-none"
                >
                  Batal
                </button>
              </div>

              <div className="h-[35vh] bg-slate-700 flex flex-col justify-around p-2 relative overflow-hidden">
                <div className="absolute right-[5%] top-0 bottom-0 w-12 z-10 opacity-90" style={{ backgroundImage: 'linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000), linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000)', backgroundSize: '20px 20px', backgroundPosition: '0 0, 10px 10px', backgroundColor: 'white' }}></div>

                {players.map((p) => (
                  <div key={p.id} className="relative h-full border-b-2 border-dashed border-slate-500 flex items-center">
                    <div 
                      className="absolute transition-all duration-500 ease-out z-20 flex flex-col items-center" 
                      style={{ left: `calc(5% + ${(p.score / finishLineScore) * 80}%)` }}
                    >
                      <CarSVG color={p.color} />
                      <span className="text-white font-black text-sm md:text-lg drop-shadow-[0_2px_4px_rgba(0,0,0,1)] bg-slate-900/60 px-2 rounded-full mt-0.5">
                        {p.name}
                      </span>
                    </div>
                  </div>
                ))}
              </div>

              <div className="h-[55vh] flex p-2 gap-2 bg-slate-300">
                {players.map((p) => (
                  <div key={p.id} className={`flex-1 flex flex-col rounded-2xl p-2 ${p.bg} border-t-8 shadow-inner`} style={{ borderColor: p.color }}>
                    <div className="text-center font-black text-3xl md:text-5xl mb-2 bg-slate-900 text-white rounded-xl py-3 shadow-md">
                      {p.question}
                    </div>
                    <div className="flex-1 grid grid-cols-2 grid-rows-2 gap-2">
                      {p.options.map(opt => (
                        <button 
                          key={opt} 
                          onClick={() => handleAnswer(p.id, opt)} 
                          className={`${p.btn} text-white font-black text-4xl md:text-6xl rounded-xl active:translate-y-2 active:shadow-none transition-all flex items-center justify-center`}
                        >
                          {opt}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </ScreenWrapper>
          );

          // STEP 4: WINNER
          if (step === 4) return (
            <ScreenWrapper>
              <div className="flex-1 flex flex-col items-center justify-center p-6 text-center">
                <div className="text-8xl mb-6">🏆</div>
                <h1 className="text-6xl md:text-8xl font-black text-indigo-900 mb-4 drop-shadow-xl">
                  SELESAI!
                </h1>
                <div className="bg-white/90 p-8 rounded-[3rem] shadow-2xl border-8 mb-8" style={{ borderColor: winner?.color }}>
                  <h2 className="text-4xl md:text-5xl font-black text-slate-800 mb-4">Pemenangnya adalah:</h2>
                  <div className="text-5xl md:text-7xl font-black" style={{ color: winner?.color }}>
                    {winner?.name}
                  </div>
                </div>
                
                <button 
                  onClick={() => { playAudio('correct'); setStep(1); }} 
                  className="bg-green-500 hover:bg-green-600 text-white font-black text-4xl px-12 py-6 rounded-[2rem] shadow-[0_10px_0_#14532d] active:translate-y-2 active:shadow-none transition-all border-4 border-white"
                >
                  Main Lagi 🔄
                </button>
              </div>
            </ScreenWrapper>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
